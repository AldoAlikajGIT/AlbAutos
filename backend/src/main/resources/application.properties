# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Database (RDS MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/albcars
spring.datasource.username=root
spring.datasource.password=Aldo17%

# ===============================
# JPA / Hibernate
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Static files
# (In production prefer S3; this keeps current behavior until you switch)
# ===============================
spring.web.resources.static-locations=file:uploads/
spring.web.resources.cache.period=3600

# ===============================
# Security / JWT
# ===============================
jwt.secret=FpmIH9SnYYVBOssqiD/6K/TVul4fxCW+sS81iNnNrsw=
jwt.expirationMs=86400000

# Disable the default in-memory user in prod
spring.security.user.name=
spring.security.user.password=

uploads.root=./uploads/cars

# ===============================
# Upload limits
# ===============================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=30MB

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.pattern.level=%5p

# ===============================
# Mail (use env vars for secrets in prod)
# ===============================
